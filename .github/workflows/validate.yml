name: validate

on:
  push:
  pull_request:

jobs:
  scaffold-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          bash -n create-datawai.sh
          bash -n scripts/*.sh
      - name: Python compile
        run: python3 -m py_compile services/dsr/main.py
      - name: JSON check
        run: python3 -m json.tool services/api/package.json >/dev/null
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/api/package.json
      - name: Node API typecheck
        run: |
          cd services/api
          npm install
          npm run build
