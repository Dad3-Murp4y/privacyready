name: PostgreSQL integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: privacyready_test
          POSTGRES_PASSWORD: synthetic_ci_database_password
          POSTGRES_DB: privacyready_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U privacyready_test -d privacyready_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://privacyready_test:synthetic_ci_database_password@127.0.0.1:5432/privacyready_test?schema=public
      RUN_POSTGRES_INTEGRATION: "true"
      SCANNER_API_KEY: synthetic-ci-scanner-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:integration:run
