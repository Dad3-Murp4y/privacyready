stages:
  - lint-and-test
  - test
  - security-scan
  - infrastructure
  - build-and-scan
  - deploy
  - cost-saver

# ---------------------------------------------
# 1. LINT AND CODE QUALITY STAGE
# ---------------------------------------------

api-lint:
  stage: lint-and-test
  image: node:22-alpine
  script:
    - cd services/api
    - npm ci
    - npm run lint
    - npm run build
  rules:
    - changes:
        - services/api/**/*

portal-lint:
  stage: lint-and-test
  image: node:22-alpine
  script:
    - cd frontend/portal
    - npm ci
    - npm run lint
  rules:
    - changes:
        - frontend/portal/**/*

python-lint:
  stage: lint-and-test
  image: python:3.11-slim
  script:
    - python -m py_compile services/dsr/main.py services/scanner/cmd/scanner/*.py
  rules:
    - changes:
        - services/dsr/**/*
        - services/scanner/**/*

# ---------------------------------------------
# 2. SECURITY SCANNING (SAST / DAST / DEPENDENCIES)
# ---------------------------------------------

# Include GitLab built-in SAST, Secret Detection and Dependency scanning
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

# Custom Dependency Vulnerability Scan (works on any GitLab version)
npm-security-audit:
  stage: security-scan
  image: node:22-alpine
  script:
    - echo "Auditing API dependencies..."
    - cd services/api && npm audit --audit-level=high || true
    - echo "Auditing Portal dependencies..."
    - cd ../../frontend/portal && npm audit --audit-level=high || true

tfsec-scan:
  stage: security-scan
  image: aquasec/tfsec-ci
  script:
    - tfsec terraform/
  allow_failure: true

python-sast:
  stage: security-scan
  image: python:3.11-slim
  before_script:
    - pip install bandit safety
  script:
    - echo "Running Bandit SAST..."
    - bandit -r services/scanner/ services/dsr/ -ll -ii
    - echo "Running Safety dependency check..."
    - safety check -r services/scanner/requirements.txt || true
    - safety check -r services/dsr/requirements.txt || true

shellcheck-scan:
  stage: security-scan
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck scripts/*.sh

# Custom DAST Check (Verifies API security headers and endpoints)
dast-security-check:
  stage: .post
  image: curlimages/curl:latest
  script:
    - echo "Running DAST endpoint validation..."
    - curl -s -I https://api.privacyready.co.uk/health | grep -i "HTTP/1.1 200\|HTTP/2 200"
    - echo "Checking security headers..."
    - curl -s -I https://api.privacyready.co.uk/health | grep -i "strict-transport-security\|x-content-type-options\|x-frame-options" || true
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------
# 3. INFRASTRUCTURE (TERRAFORM VIA MAKEFILE)
# ---------------------------------------------
# All infra changes run through the same `make` targets a developer
# would run locally (see root Makefile) -- CI is never a second,
# different path to the same infrastructure.
#
# Split to match terraform/persistent vs terraform/environments/*:
# persistent (GitLab/DNS/SES/ECR) essentially never changes and is
# manual-only with its own path rule; the production app environment
# plans automatically on every terraform/environments/production
# change and applies on manual approval.

.terraform-base:
  image: hashicorp/terraform:1.9
  before_script:
    - apk add --no-cache make bash aws-cli

persistent-plan:
  extends: .terraform-base
  stage: infrastructure
  script:
    - make persistent-plan
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - terraform/persistent/**/*
        - terraform/modules/**/*
      when: manual

persistent-apply:
  extends: .terraform-base
  stage: infrastructure
  script:
    - make persistent-apply
  environment:
    name: persistent
    action: start
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

terraform-plan:
  extends: .terraform-base
  stage: infrastructure
  script:
    - make plan ENV=production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - terraform/environments/production/**/*
        - terraform/modules/**/*

terraform-apply:
  extends: .terraform-base
  stage: infrastructure
  script:
    - make apply ENV=production
  environment:
    name: production
    action: start
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - terraform/environments/production/**/*
        - terraform/modules/**/*
      when: manual
      allow_failure: false

# Destroys only environments/production's app infrastructure --
# GitLab/DNS/SES/ECR live in a completely separate state
# (terraform/persistent) that this command has no reference to and
# cannot reach. Deliberately not tied to a path-change rule -- this
# must always require someone to explicitly click "run", never fire
# as a side effect of an unrelated terraform change.
terraform-destroy:
  extends: .terraform-base
  stage: infrastructure
  script:
    - make destroy ENV=production CONFIRM=yes
  environment:
    name: production
    action: stop
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

# ---------------------------------------------
# 4. BUILD, SCAN, AND PUSH (TRIVY + ECR)
# ---------------------------------------------

.build-scan-push:
  stage: build-and-scan
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    AWS_DEFAULT_REGION: "eu-west-2"
  before_script:
    - apk add --no-cache aws-cli curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.48.0
    - export ECR_REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.eu-west-2.amazonaws.com"
    - aws ecr get-login-password --region eu-west-2 | docker login --username AWS --password-stdin $ECR_REGISTRY
  script:
    - echo "Building $SERVICE_NAME..."
    - docker build -t $ECR_REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHA $BUILD_CONTEXT
    - echo "Scanning image with Trivy (blocking on HIGH/CRITICAL)..."
    - trivy image --exit-code 1 --severity HIGH,CRITICAL $ECR_REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHA
    - echo "Scan passed! Pushing image to ECR..."
    - docker push $ECR_REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHA
    - docker tag $ECR_REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHA $ECR_REGISTRY/$SERVICE_NAME:latest
    - docker push $ECR_REGISTRY/$SERVICE_NAME:latest

build-api:
  extends: .build-scan-push
  variables:
    SERVICE_NAME: "privacyready-api"
    BUILD_CONTEXT: "services/api"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - services/api/**/*

build-scanner:
  extends: .build-scan-push
  variables:
    SERVICE_NAME: "privacyready-scanner"
    BUILD_CONTEXT: "services/scanner/cmd/scanner"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - services/scanner/**/*

# ---------------------------------------------
# 5. DEPLOY STAGE (via Makefile's `roll` target --
#    same command a developer would run locally after a manual push)
# ---------------------------------------------

.deploy-base:
  stage: deploy
  image: hashicorp/terraform:1.9
  before_script:
    - apk add --no-cache make bash aws-cli

deploy-api:
  extends: .deploy-base
  script:
    - make roll SERVICE=api ENV=production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - services/api/**/*

deploy-scanner:
  extends: .deploy-base
  script:
    - make roll SERVICE=scanner ENV=production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - services/scanner/**/*

deploy-frontend:
  extends: .deploy-base
  script:
    - make deploy-frontend ENV=production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - frontend/**/*
        - '!frontend/portal/**/*'

deploy-portal:
  extends: .deploy-base
  before_script:
    - apk add --no-cache make bash aws-cli nodejs npm
  script:
    - make deploy-portal ENV=production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - frontend/portal/**/*


# ---------------------------------------------
# 6. COST-SAVER STAGES (MANUAL CLEANUP)
# ---------------------------------------------

prod-environment-shutdown:
  stage: cost-saver
  image: hashicorp/terraform:1.9
  before_script:
    - apk add --no-cache aws-cli make bash curl jq
  script:
    - make environment-shutdown ENV=production
  when: manual
  environment:
    name: production
    action: stop
  allow_failure: true

prod-environment-startup:
  stage: cost-saver
  image: hashicorp/terraform:1.9
  before_script:
    - apk add --no-cache aws-cli make bash curl jq
  script:
    - make environment-startup ENV=production
  when: manual
  environment:
    name: production
    action: start
  allow_failure: true

test-environment-shutdown:
  stage: cost-saver
  image: hashicorp/terraform:1.9
  before_script:
    - apk add --no-cache aws-cli make bash curl jq
  script:
    - make environment-shutdown ENV=test
  when: manual
  environment:
    name: test
    action: stop
  allow_failure: true

test-environment-startup:
  stage: cost-saver
  image: hashicorp/terraform:1.9
  before_script:
    - apk add --no-cache aws-cli make bash curl jq
  script:
    - make environment-startup ENV=test
  when: manual
  environment:
    name: test
    action: start
  allow_failure: true
