stages:
  - lint-and-test
  - security-scan
  - build-and-scan
  - deploy
  - cost-saver

# ---------------------------------------------
# 1. LINT AND CODE QUALITY STAGE
# ---------------------------------------------

api-lint:
  stage: lint-and-test
  image: node:22-alpine
  script:
    - cd services/api
    - npm ci
    - npm run lint
    - npm run build
  rules:
    - changes:
        - services/api/**/*

portal-lint:
  stage: lint-and-test
  image: node:22-alpine
  script:
    - cd frontend/portal
    - npm ci
    - npm run lint
  rules:
    - changes:
        - frontend/portal/**/*

python-lint:
  stage: lint-and-test
  image: python:3.11-slim
  script:
    - python -m py_compile services/dsr/main.py services/scanner/cmd/scanner/*.py
  rules:
    - changes:
        - services/dsr/**/*
        - services/scanner/**/*

# ---------------------------------------------
# 2. SECURITY SCANNING (SAST / DAST / DEPENDENCIES)
# ---------------------------------------------

# Include GitLab built-in SAST, Secret Detection and Dependency scanning
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

# Custom Dependency Vulnerability Scan (works on any GitLab version)
npm-security-audit:
  stage: security-scan
  image: node:22-alpine
  script:
    - echo "Auditing API dependencies..."
    - cd services/api && npm audit --audit-level=high || true
    - echo "Auditing Portal dependencies..."
    - cd ../../frontend/portal && npm audit --audit-level=high || true

tfsec-scan:
  stage: security-scan
  image: aquasec/tfsec-ci
  script:
    - tfsec terraform/
  allow_failure: true

python-sast:
  stage: security-scan
  image: python:3.11-slim
  before_script:
    - pip install bandit safety
  script:
    - echo "Running Bandit SAST..."
    - bandit -r services/scanner/ services/dsr/ -ll -ii
    - echo "Running Safety dependency check..."
    - safety check -r services/scanner/requirements.txt || true
    - safety check -r services/dsr/requirements.txt || true

shellcheck-scan:
  stage: security-scan
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck scripts/*.sh

# Custom DAST Check (Verifies API security headers and endpoints)
dast-security-check:
  stage: security-scan
  image: curlimages/curl:latest
  script:
    - echo "Running DAST endpoint validation..."
    - curl -s -I https://api.datawai.co.uk/health | grep -i "HTTP/1.1 200\|HTTP/2 200"
    - echo "Checking security headers..."
    - curl -s -I https://api.datawai.co.uk/health | grep -i "strict-transport-security\|x-content-type-options\|x-frame-options" || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------
# 3. BUILD, SCAN, AND PUSH (TRIVY + ECR)
# ---------------------------------------------

.build-scan-push:
  stage: build-and-scan
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    ECR_REGISTRY: "138973100176.dkr.ecr.ap-southeast-1.amazonaws.com"
  before_script:
    - apk add --no-cache aws-cli curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.48.0
    - aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
  script:
    - echo "Building $SERVICE_NAME..."
    - docker build -t $ECR_REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHA $BUILD_CONTEXT
    - echo "Scanning image with Trivy (blocking on HIGH/CRITICAL)..."
    - trivy image --exit-code 1 --severity HIGH,CRITICAL $ECR_REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHA
    - echo "Scan passed! Pushing image to ECR..."
    - docker push $ECR_REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHA
    - docker tag $ECR_REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHA $ECR_REGISTRY/$SERVICE_NAME:latest
    - docker push $ECR_REGISTRY/$SERVICE_NAME:latest

build-api:
  extends: .build-scan-push
  variables:
    SERVICE_NAME: "privacyready-api"
    BUILD_CONTEXT: "services/api"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - services/api/**/*

build-dsr:
  extends: .build-scan-push
  variables:
    SERVICE_NAME: "privacyready-dsr"
    BUILD_CONTEXT: "services/dsr"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - services/dsr/**/*

build-scanner:
  extends: .build-scan-push
  variables:
    SERVICE_NAME: "privacyready-scanner"
    BUILD_CONTEXT: "services/scanner"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - services/scanner/**/*

# ---------------------------------------------
# 4. DEPLOY STAGE
# ---------------------------------------------

deploy-api:
  stage: deploy
  image: amazon/aws-cli:latest
  script:
    - echo "Deploying updated API task definition and triggering ECS update..."
    - aws ecs update-service --cluster privacyready-cluster --service privacyready-api --force-new-deployment --region ap-southeast-1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - services/api/**/*

deploy-dsr:
  stage: deploy
  image: amazon/aws-cli:latest
  script:
    - echo "Deploying updated DSR task definition and triggering ECS update..."
    - aws ecs update-service --cluster privacyready-cluster --service privacyready-dsr --force-new-deployment --region ap-southeast-1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - services/dsr/**/*

deploy-scanner:
  stage: deploy
  image: amazon/aws-cli:latest
  script:
    - echo "Deploying updated Scanner task definition and triggering ECS update..."
    - aws ecs update-service --cluster privacyready-cluster --service privacyready-scanner --force-new-deployment --region ap-southeast-1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - services/scanner/**/*

# ---------------------------------------------
# 5. COST-SAVER STAGES (MANUAL CLEANUP)
# ---------------------------------------------

environment-shutdown:
  stage: cost-saver
  image: alpine:latest
  before_script:
    - apk add --no-cache aws-cli terraform bash curl jq
  script:
    - echo "Executing Environment Teardown to Save Costs..."
    - chmod +x ./scripts/teardown-testing.sh
    - ./scripts/teardown-testing.sh
  when: manual
  environment:
    name: testing-teardown
    action: stop

environment-startup:
  stage: cost-saver
  image: alpine:latest
  before_script:
    - apk add --no-cache aws-cli terraform bash curl jq
  script:
    - echo "Restoring Environment and Re-deploying Services..."
    - chmod +x ./scripts/startup-testing.sh
    - ./scripts/startup-testing.sh
  when: manual
  environment:
    name: testing-teardown
    action: start
