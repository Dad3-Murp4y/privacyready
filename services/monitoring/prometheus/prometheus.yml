global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "privacyready-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api.privacyready-test.local:8080"]
        labels:
          environment: "test"
          service: "api"

  - job_name: "privacyready-scanner"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["scanner.privacyready-test.local:8080"]
        labels:
          environment: "test"
          service: "scanner"

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter.privacyready-test.local:9187"]
        labels:
          environment: "test"
          service: "database"

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter.privacyready-test.local:9121"]
        labels:
          environment: "test"
          service: "cache"
