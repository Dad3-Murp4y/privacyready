groups:
  - name: PrivacyReadyAlerts
    rules:
      - alert: HighAPIErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) * 100 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API 5xx error rate above 5%"
          description: "High error rate detected on API service: {{ $value }}% HTTP 5xx errors."

      - alert: APILatencyHigh
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency exceeds 1.5s"
          description: "API p95 latency is currently {{ $value }}s."

      - alert: DatabaseHighConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High PostgreSQL active connections"
          description: "PostgreSQL active connections count is {{ $value }}."

      - alert: ScannerFailureSpike
        expr: rate(scanner_jobs_failed_total[10m]) / rate(scanner_jobs_total[10m]) * 100 > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Compliance Scanner failure spike"
          description: "Scanner failure rate is elevated above 10%."

      - alert: DSRStatutoryDeadlineWarning
        expr: dsr_requests_active_total > 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated DSR queue approaching 30-day UK GDPR statutory limit"
          description: "Active Subject Access Requests total is {{ $value }}."

      - alert: SESBounceRateElevated
        expr: rate(aws_ses_bounce_total[15m]) / rate(aws_ses_send_total[15m]) * 100 > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "AWS SES Email Bounce Rate Exceeds 5%"
          description: "SES email bounce rate is {{ $value }}%, approaching AWS reputation risk threshold."
